<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22d3ee">
    <title id="page-title"> Expense Tracker By Abdur Rahim| খরচ ট্র্যাকার বাই আব্দুর রাহিম</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        :root { --neon-cyan: #22d3ee; }
        .dark { --neon-cyan: #67e8f9; }
        
        * { transition: all 0.3s ease; }
        
        .glass {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .dark .glass { background: rgba(15,23,42,0.75); border-color: rgba(255,255,255,0.1); }
        .light .glass { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.1); color: #1e2937; }
        
        .neon-text { text-shadow: 0 0 15px var(--neon-cyan); }
        .currency { font-family: monospace; }

        @media (max-width: 640px) {
            .container { padding-left: 1rem; padding-right: 1rem; }
            .summary-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        }

        .modal {
            animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(80px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 to-indigo-950 dark:from-slate-950 dark:to-indigo-950 light:from-slate-100 light:to-indigo-100 min-h-screen text-slate-900 dark:text-white light:text-slate-900">

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="openProfileModal()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-lg hover:bg-white/10 hover:scale-105 active:scale-95 transition-all">👤</button>
                
                <div class="hidden md:flex items-center gap-2">
                    <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-2xl">🕊️</div>
                    <h1 class="text-xl font-semibold tracking-tight neon-text"> Expense Tracker</h1>
                </div>

                <!-- Real-time Visitors -->
                <div class="flex items-center gap-2">
                    <div class="glass px-3 py-1.5 rounded-full flex items-center gap-2 border-emerald-500/30">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span id="live-count" class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="exportToPDF()" id="pdf-btn" class="glass px-3 py-2 rounded-3xl text-xs sm:text-sm font-medium hover:bg-white/10">📄 PDF</button>
                <button onclick="toggleLanguage()" id="lang-btn" class="glass px-3 py-2 rounded-3xl text-xs sm:text-sm font-medium hover:bg-white/10">EN</button>
                <button onclick="toggleTheme()" id="theme-btn" class="glass w-9 h-9 rounded-3xl flex items-center justify-center text-lg hover:bg-white/10">🌙</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-5 py-6 container">
        <h2 id="greeting" class="text-4xl sm:text-5xl font-semibold mb-8"></h2>

        <!-- Summary -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10 summary-grid">
            <div class="glass rounded-3xl p-6">
                <p id="lbl-total-income" class="text-emerald-400 text-sm">মোট আয়</p>
                <p id="total-income" class="text-4xl sm:text-5xl font-bold text-emerald-400 mt-2 currency">৳0</p>
            </div>
            <div class="glass rounded-3xl p-6">
                <p id="lbl-total-expense" class="text-rose-400 text-sm">মোট খরচ</p>
                <p id="total-expense" class="text-4xl sm:text-5xl font-bold text-rose-400 mt-2 currency">৳0</p>
            </div>
            <div class="glass rounded-3xl p-6">
                <p id="lbl-current-balance" class="text-cyan-400 text-sm">ব্যালেন্স</p>
                <p id="current-balance" class="text-4xl sm:text-5xl font-bold text-cyan-400 mt-2 currency">৳0</p>
            </div>
        </div>

        <!-- Transaction Form -->
        <div class="lg:grid lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 glass rounded-3xl p-6 sm:p-8 mb-8 lg:mb-0">
                <h3 id="lbl-new-tx" class="text-xl sm:text-2xl font-semibold mb-6">নতুন লেনদেন</h3>
                <form id="transaction-form" onsubmit="addTransaction(event)">
                    <div class="space-y-6">
                        <div>
                            <label id="lbl-type" class="block text-sm mb-2">ধরন</label>
                            <div class="flex bg-white/10 rounded-3xl p-1">
                                <button type="button" id="btn-income" onclick="setType('income')" class="flex-1 py-3.5 rounded-3xl font-medium text-sm">আয়</button>
                                <button type="button" id="btn-expense" onclick="setType('expense')" class="flex-1 py-3.5 rounded-3xl font-medium text-sm">খরচ</button>
                            </div>
                        </div>
                        <div>
                            <label id="lbl-amount" class="block text-sm mb-2">পরিমাণ (৳)</label>
                            <div class="relative">
                                <span class="absolute left-6 top-1/2 -translate-y-1/2 text-3xl text-cyan-400">৳</span>
                                <input id="amount" type="number" step="0.01" placeholder="0.00" class="w-full glass rounded-3xl pl-14 pr-6 py-5 text-3xl font-mono" required>
                            </div>
                        </div>
                        <div>
                            <label id="lbl-category" class="block text-sm mb-2">বিভাগ</label>
                            <select id="category" class="w-full glass rounded-3xl px-6 py-5"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label id="lbl-date" class="block text-sm mb-2">তারিখ</label>
                                <input id="date" type="date" class="w-full glass rounded-3xl px-6 py-5">
                            </div>
                            <div>
                                <label id="lbl-note" class="block text-sm mb-2">নোট</label>
                                <input id="note" type="text" placeholder="নোট লিখুন" class="w-full glass rounded-3xl px-6 py-5">
                            </div>
                        </div>
                    </div>
                    <button type="submit" id="btn-submit" class="mt-10 w-full bg-gradient-to-r from-cyan-400 to-purple-500 text-black font-bold py-5 rounded-3xl text-lg">লেনদেন যোগ করুন</button>
                </form>
            </div>
            <div class="lg:col-span-7">
                <div id="transactions-container" class="space-y-6"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[9999] items-center justify-center">
        <div class="glass max-w-sm w-full mx-4 rounded-3xl p-7 modal">
            <h3 id="lbl-profile-title" class="text-xl font-semibold mb-6">আপনার নাম</h3>
            <input id="profile-name-input" type="text" placeholder="আপনার নাম লিখুন" class="w-full glass rounded-3xl px-6 py-4 mb-6 outline-none focus:border-cyan-400">
            <div class="flex gap-3">
                <button onclick="closeProfileModal()" id="btn-profile-cancel" class="flex-1 py-3 border border-white/30 rounded-3xl hover:bg-white/10">বাতিল</button>
                <button onclick="saveProfileName()" id="btn-profile-save" class="flex-1 py-3 bg-cyan-400 text-black font-semibold rounded-3xl hover:bg-cyan-300">সংরক্ষণ</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[9999] items-center justify-center">
        <div class="glass max-w-md w-full mx-4 rounded-3xl p-7 modal">
            <div class="flex justify-between mb-6">
                <h3 id="lbl-detail-title" class="text-xl font-semibold">বিস্তারিত</h3>
                <button onclick="closeDetailModal()" class="text-3xl text-slate-400 hover:text-white">×</button>
            </div>
            <div id="modal-content" class="space-y-6"></div>
            <div class="flex gap-3 mt-10">
                <button onclick="deleteCurrentTransaction()" id="btn-delete" class="flex-1 py-4 bg-rose-500/20 text-rose-400 rounded-3xl font-medium">ডিলিট</button>
                <button onclick="alert('এডিট অপশনটি শীঘ্রই আসবে')" id="btn-edit-open" class="flex-1 py-4 bg-cyan-400 text-black rounded-3xl font-semibold">এডিট</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAgT8Da6KcV3KVcX_oIq4bbBwMWoXgGQoE",
            authDomain: "sahokher-jinis.firebaseapp.com",
            databaseURL: "https://sahokher-jinis-default-rtdb.firebaseio.com",
            projectId: "sahokher-jinis",
            storageBucket: "sahokher-jinis.firebasestorage.app",
            messagingSenderId: "2153850751",
            appId: "1:2153850751:web:bec13835cbc88cd44a5c4a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initRealtimeVisitors() {
            const liveCountEl = document.getElementById('live-count');
            const myConnectionsRef = db.ref('status/connections');
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    const con = myConnectionsRef.push(true);
                    con.onDisconnect().remove();
                }
            });

            myConnectionsRef.on('value', (snap) => {
                const count = snap.numChildren() || 0;
                const label = currentLang === 'bn' ? 'লাইভ' : 'Live';
                liveCountEl.textContent = `${count} ${label}`;
            });
        }

        // --- 2. CORE APP LOGIC ---
        let transactions = [];
        let currentTransaction = null;
        let currentType = 'expense';
        let currentLang = localStorage.getItem('lang') || 'bn';
        let currentTheme = localStorage.getItem('theme') || 'dark';
        const currency = '৳';

        const i18n = {
            bn: {
                totalIncome: "মোট আয়", totalExpense: "মোট খরচ", currentBalance: "ব্যালেন্স",
                newTx: "নতুন লেনদেন", type: "ধরন", income: "আয়", expense: "খরচ",
                amount: "পরিমাণ (৳)", category: "বিভাগ", date: "তারিখ", note: "নোট",
                addBtn: "লেনদেন যোগ করুন", notePlaceholder: "নোট লিখুন",
                detailTitle: "বিস্তারিত", delete: "ডিলিট", edit: "এডিট",
                cancel: "বাতিল", save: "সংরক্ষণ", noNote: "নোট নেই", noTx: "কোনো লেনদেন নেই।",
                profileTitle: "আপনার নাম", profilePlaceholder: "আপনার নাম লিখুন",
                defaultUser: "ব্যবহারকারী", toastNameSaved: "নাম সেভ হয়েছে ✓"
            },
            en: {
                totalIncome: "Total Income", totalExpense: "Total Expense", currentBalance: "Balance",
                newTx: "New Transaction", type: "Type", income: "Income", expense: "Expense",
                amount: "Amount (৳)", category: "Category", date: "Date", note: "Note",
                addBtn: "Add Transaction", notePlaceholder: "Write a note",
                detailTitle: "Details", delete: "Delete", edit: "Edit",
                cancel: "Cancel", save: "Save", noNote: "No note", noTx: "No transactions.",
                profileTitle: "Your Name", profilePlaceholder: "Enter your name",
                defaultUser: "User", toastNameSaved: "Name Saved ✓"
            }
        };

        // --- RESTORED ALL CATEGORIES ---
        const catsMap = {
            income: [
                { bn: "বেতন", en: "Salary" },
                { bn: "ফ্রিল্যান্স", en: "Freelance" },
                { bn: "বিনিয়োগ", en: "Investment" },
                { bn: "বোনাস", en: "Bonus" },
                { bn: "অন্যান্য", en: "Others" }
            ],
            expense: [
                { bn: "বাজার", en: "Groceries" },
                { bn: "যাতায়াত", en: "Transport" },
                { bn: "বাসা ভাড়া", en: "Rent" },
                { bn: "বিল", en: "Bills" },
                { bn: "শপিং", en: "Shopping" },
                { bn: "বিনোদন", en: "Entertainment" },
                { bn: "স্বাস্থ্য", en: "Health" },
                { bn: "ভ্রমণ", en: "Travel" },
                { bn: "শিক্ষা", en: "Education" },
                { bn: "অন্যান্য", en: "Others" }
            ]
        };

        function updateUILanguage() {
            const t = i18n[currentLang];
            document.getElementById("greeting").textContent = getDynamicGreeting();
            document.getElementById("lbl-total-income").textContent = t.totalIncome;
            document.getElementById("lbl-total-expense").textContent = t.totalExpense;
            document.getElementById("lbl-current-balance").textContent = t.currentBalance;
            document.getElementById("lbl-new-tx").textContent = t.newTx;
            document.getElementById("lbl-type").textContent = t.type;
            document.getElementById("btn-income").textContent = t.income;
            document.getElementById("btn-expense").textContent = t.expense;
            document.getElementById("lbl-amount").textContent = t.amount;
            document.getElementById("lbl-category").textContent = t.category;
            document.getElementById("lbl-date").textContent = t.date;
            document.getElementById("lbl-note").textContent = t.note;
            document.getElementById("note").placeholder = t.notePlaceholder;
            document.getElementById("btn-submit").textContent = t.addBtn;
            document.getElementById("lbl-profile-title").textContent = t.profileTitle;
            document.getElementById("profile-name-input").placeholder = t.profilePlaceholder;
            document.getElementById("btn-profile-cancel").textContent = t.cancel;
            document.getElementById("btn-profile-save").textContent = t.save;
            document.getElementById("lang-btn").textContent = currentLang === 'bn' ? 'EN' : 'বাংলা';
            setType(currentType);
            renderGroupedTransactions();
        }

        // Profile Functions
        function openProfileModal() {
            document.getElementById('profile-name-input').value = localStorage.getItem('userName') || '';
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('profile-modal').classList.add('flex');
        }
        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
            document.getElementById('profile-modal').classList.remove('flex');
        }
        function saveProfileName() {
            const name = document.getElementById('profile-name-input').value.trim();
            if (name) localStorage.setItem('userName', name);
            else localStorage.removeItem('userName');
            closeProfileModal();
            updateUILanguage();
            showToast(i18n[currentLang].toastNameSaved);
        }

        function getDynamicGreeting() {
            let name = localStorage.getItem('userName') || i18n[currentLang].defaultUser;
            const hour = new Date().getHours();
            let msg = hour < 12 ? (currentLang==='bn'?"শুভ সকাল":"Good Morning") : 
                      hour < 18 ? (currentLang==='bn'?"শুভ বিকেল":"Good Afternoon") : 
                                  (currentLang==='bn'?"শুভ সন্ধ্যা":"Good Evening");
            return `${msg}, ${name}`;
        }

        function setType(t) {
            currentType = t;
            document.getElementById("btn-income").classList.toggle("bg-emerald-500", t === 'income');
            document.getElementById("btn-expense").classList.toggle("bg-rose-500", t === 'expense');
            const sel = document.getElementById("category"); sel.innerHTML = "";
            catsMap[t].forEach(c => { const o = document.createElement("option"); o.value = c.bn; o.textContent = c[currentLang]; sel.appendChild(o); });
        }

        function addTransaction(e) {
            e.preventDefault();
            const amt = document.getElementById("amount").value;
            transactions.unshift({
                id: Date.now(),
                type: currentType,
                amount: amt,
                category: document.getElementById("category").value,
                date: document.getElementById("date").value || new Date().toISOString().split('T')[0],
                note: document.getElementById("note").value
            });
            saveData(); calculateTotals(); renderGroupedTransactions(); e.target.reset();
        }

        function calculateTotals() {
            let inc = 0, exp = 0;
            transactions.forEach(t => t.type === 'income' ? inc += parseFloat(t.amount) : exp += parseFloat(t.amount));
            document.getElementById("total-income").textContent = currency + inc.toLocaleString();
            document.getElementById("total-expense").textContent = currency + exp.toLocaleString();
            document.getElementById("current-balance").textContent = currency + Math.abs(inc - exp).toLocaleString();
        }

        function renderGroupedTransactions() {
            const container = document.getElementById("transactions-container");
            container.innerHTML = "";
            const grouped = {};
            transactions.forEach(tx => { if (!grouped[tx.date]) grouped[tx.date] = []; grouped[tx.date].push(tx); });
            const dates = Object.keys(grouped).sort((a,b) => new Date(b) - new Date(a));
            
            dates.forEach(date => {
                const groupDiv = document.createElement("div"); groupDiv.className = "mb-4";
                const head = document.createElement("div"); head.className = "glass px-5 py-4 rounded-3xl flex justify-between cursor-pointer mb-2";
                head.innerHTML = `<p class="font-medium">${date}</p><p class="text-xs opacity-50">▼</p>`;
                const list = document.createElement("div"); list.className = "space-y-3 hidden";
                head.onclick = () => list.classList.toggle("hidden");
                grouped[date].forEach(tx => {
                    const card = document.createElement("div");
                    card.className = "glass p-5 rounded-3xl flex justify-between items-center border-l-4 " + (tx.type==='income'?'border-emerald-400':'border-rose-400');
                    card.onclick = () => showDetail(tx);
                    card.innerHTML = `<div><p class="font-medium">${getCatDisplay(tx.category)}</p></div><p class="font-mono ${tx.type==='income'?'text-emerald-400':'text-rose-400'}">${tx.type==='income'?'+':'-'}${tx.amount}</p>`;
                    list.appendChild(card);
                });
                groupDiv.appendChild(head); groupDiv.appendChild(list); container.appendChild(groupDiv);
            });
        }

        function showDetail(tx) {
            currentTransaction = tx;
            const content = document.getElementById("modal-content");
            content.innerHTML = `<div class="space-y-4"><p class="text-slate-400">বিভাগ: <span class="text-white">${getCatDisplay(tx.category)}</span></p><p class="text-slate-400">পরিমাণ: <span class="text-white">${currency}${tx.amount}</span></p><p class="text-slate-400">নোট: <span class="text-white">${tx.note || 'নেই'}</span></p></div>`;
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("flex");
        }
        function closeDetailModal() { document.getElementById("detail-modal").classList.add("hidden"); }
        function deleteCurrentTransaction() {
            transactions = transactions.filter(t => t.id !== currentTransaction.id);
            saveData(); calculateTotals(); renderGroupedTransactions(); closeDetailModal();
        }

        function getCatDisplay(n) { const f = catsMap.income.concat(catsMap.expense).find(c => c.bn === n || c.en === n); return f ? f[currentLang] : n; }
        function saveData() { localStorage.setItem("transactions", JSON.stringify(transactions)); }
        function loadData() { const s = localStorage.getItem("transactions"); if (s) transactions = JSON.parse(s); }
        function toggleTheme() { currentTheme = currentTheme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', currentTheme); document.documentElement.className = currentTheme; }
        function toggleLanguage() { currentLang = currentLang === 'bn' ? 'en' : 'bn'; localStorage.setItem('lang', currentLang); updateUILanguage(); }
        function showToast(m) { const t = document.createElement("div"); t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-white z-[9999]"; t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2000); }

        window.onload = () => {
            loadData();
            updateUILanguage();
            calculateTotals();
            initRealtimeVisitors();
            document.documentElement.className = currentTheme;
        };
    </script>
</body>
</html>
